<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAU Digital Campus Wallet</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for professional look and feel */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4; /* Light Mint Background */
        }
        .app-container {
            min-height: 100vh;
        }
        .balance-card {
            background: linear-gradient(135deg, #065f46 0%, #047857 100%); /* Dark Teal Gradient */
            box-shadow: 0 10px 25px -5px rgba(4, 120, 87, 0.4);
        }
        .nav-btn.active {
            background-color: #047857; /* Active Green */
            color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .transaction-list-item:nth-child(even) {
            background-color: #f0fdf4; /* Lighter background for striped effect */
        }
    </style>
</head>
<body class="selection:bg-emerald-200">

<div id="app-container" class="app-container mx-auto max-w-7xl">
    
    <!-- Header -->
    <header class="bg-white shadow-md">
        <div class="px-4 py-3 sm:px-6 lg:px-8 flex justify-between items-center">
            <div class="text-2xl font-bold text-emerald-800">
                SAU Wallet
            </div>
            <div class="text-sm text-gray-500 hidden sm:block">
                Sundrabai Manik Adsul Polytechnic
            </div>
        </div>
    </header>

    <div class="flex flex-col sm:flex-row max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Navigation Sidebar (Left) -->
        <nav class="w-full sm:w-1/4 mb-6 sm:mb-0 sm:pr-4">
            <div class="bg-white rounded-xl shadow-lg p-3 space-y-2">
                <button onclick="changeView('dashboard')" id="nav-dashboard" class="nav-btn active w-full py-3 px-4 text-left text-gray-700 font-medium transition duration-200 rounded-lg hover:bg-emerald-50 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    🏠 Dashboard
                </button>
                <button onclick="changeView('pay')" id="nav-pay" class="nav-btn w-full py-3 px-4 text-left text-gray-700 font-medium transition duration-200 rounded-lg hover:bg-emerald-50 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    🛒 Pay/Scan
                </button>
                <button onclick="changeView('add')" id="nav-add" class="nav-btn w-full py-3 px-4 text-left text-gray-700 font-medium transition duration-200 rounded-lg hover:bg-emerald-50 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    💰 Add Money
                </button>
                <button onclick="changeView('history')" id="nav-history" class="nav-btn w-full py-3 px-4 text-left text-gray-700 font-medium transition duration-200 rounded-lg hover:bg-emerald-50 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    📜 Transaction History
                </button>
                <button onclick="alert('This feature is not implemented in this demo.')" class="w-full py-3 px-4 text-left text-red-600 font-medium transition duration-200 rounded-lg hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-500">
                    ⚙️ Settings
                </button>
            </div>
        </nav>

        <!-- Main Content Area (Right) -->
        <main class="w-full sm:w-3/4">

            <!-- 1. Dashboard View -->
            <div id="dashboard" class="view">
                <!-- Balance Card -->
                <div class="balance-card p-6 rounded-xl text-white mb-6">
                    <p class="text-lg font-light opacity-80">Current Wallet Balance</p>
                    <p id="balanceDisplay" class="text-5xl font-extrabold mt-1">₹ 0.00</p>
                    <p class="mt-4 text-sm opacity-90">User ID: <span id="userIdDisplay" class="font-mono">Loading...</span></p>
                </div>

                <!-- Quick Actions -->
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <button onclick="changeView('pay')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-4 rounded-xl shadow-lg transition duration-200">
                        <span class="text-2xl">🛒</span> <br> Quick Pay
                    </button>
                    <button onclick="changeView('add')" class="bg-teal-600 hover:bg-teal-700 text-white font-semibold py-4 rounded-xl shadow-lg transition duration-200">
                        <span class="text-2xl">➕</span> <br> Load Wallet
                    </button>
                </div>

                <!-- Latest Transactions -->
                <div class="bg-white p-6 rounded-xl shadow-lg">
                    <h2 class="text-xl font-semibold text-gray-700 mb-4">Latest Activity</h2>
                    <ul id="latestTransactionList" class="space-y-2">
                        <!-- Transactions will be loaded here by JS -->
                    </ul>
                    <button onclick="changeView('history')" class="mt-4 text-emerald-600 hover:text-emerald-800 font-medium">
                        View All History &rarr;
                    </button>
                </div>
            </div>

            <!-- 2. Pay/Scan View -->
            <div id="pay" class="view hidden bg-white p-8 rounded-xl shadow-lg">
                <h2 class="text-3xl font-bold text-emerald-800 mb-6">🛒 Campus Payment</h2>
                <div class="space-y-6">
                    <div>
                        <label for="merchant" class="block text-sm font-medium text-gray-700">Select Merchant/Shop</label>
                        <select id="merchant" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-3 bg-gray-50 border">
                            <option value="Canteen">Canteen (Main)</option>
                            <option value="Bookstore">Bookstore / Stationery</option>
                            <option value="Photocopy">Photocopy & Printing</option>
                            <option value="Bus_Fee">Bus Fee Payment</option>
                        </select>
                    </div>
                    <div>
                        <label for="payAmount" class="block text-sm font-medium text-gray-700">Amount (₹)</label>
                        <input type="number" id="payAmount" placeholder="e.g., 25.00" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-3 bg-gray-50 border">
                    </div>
                    <button onclick="simulatePayment()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                        Complete Payment
                    </button>
                </div>
                <p id="payMessage" class="mt-6 text-center font-medium text-red-600"></p>
            </div>

            <!-- 3. Add Money View -->
            <div id="add" class="view hidden bg-white p-8 rounded-xl shadow-lg">
                <h2 class="text-3xl font-bold text-emerald-800 mb-6">💰 Load Wallet Balance</h2>
                <div class="space-y-6">
                    <div>
                        <label for="addAmount" class="block text-sm font-medium text-gray-700">Deposit Amount (₹)</label>
                        <input type="number" id="addAmount" placeholder="Minimum ₹ 100" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-3 bg-gray-50 border">
                    </div>
                    <div>
                        <label for="paymentMethod" class="block text-sm font-medium text-gray-700">Payment Method (Simulated)</label>
                        <select id="paymentMethod" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-3 bg-gray-50 border">
                            <option value="UPI">UPI (Google Pay, PhonePe)</option>
                            <option value="Card">Debit/Credit Card</option>
                            <option value="Net_Banking">Net Banking</option>
                        </select>
                    </div>
                    <button onclick="simulateDeposit()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                        Confirm Deposit
                    </button>
                </div>
                <p id="addMessage" class="mt-6 text-center font-medium text-emerald-600"></p>
            </div>

            <!-- 4. History View -->
            <div id="history" class="view hidden bg-white p-8 rounded-xl shadow-lg">
                <h2 class="text-3xl font-bold text-emerald-800 mb-6">📜 All Transactions</h2>
                <div id="historyContainer" class="max-h-[60vh] overflow-y-auto">
                    <ul id="fullTransactionList" class="divide-y divide-gray-100">
                        <!-- Full history will be loaded here by JS -->
                    </ul>
                    <p id="noHistoryMessage" class="hidden text-center text-gray-500 mt-6">No transactions recorded yet.</p>
                </div>
            </div>

        </main>
    </div>
</div>

<script>
    // Global variables for wallet state
    let currentBalance = 500.00; // Initial balance
    const userId = 'SAU' + Math.floor(Math.random() * 9000 + 1000) + '/' + new Date().getFullYear(); // Simulated User ID
    let transactions = [
        { id: crypto.randomUUID(), type: 'debit', description: 'Canteen (Tea & Snacks)', amount: 35.00, date: new Date(Date.now() - 86400000) }, // 1 day ago
        { id: crypto.randomUUID(), type: 'credit', description: 'Deposit via UPI', amount: 300.00, date: new Date(Date.now() - 172800000) }, // 2 days ago
        { id: crypto.randomUUID(), type: 'debit', description: 'Bookstore (Notebooks)', amount: 150.00, date: new Date(Date.now() - 259200000) } // 3 days ago
    ];

    // --- DOM Elements ---
    const balanceDisplay = document.getElementById('balanceDisplay');
    const userIdDisplay = document.getElementById('userIdDisplay');
    const latestTransactionList = document.getElementById('latestTransactionList');
    const fullTransactionList = document.getElementById('fullTransactionList');

    // --- Core Functions ---

    /** Renders the current balance and transaction lists. */
    function renderWallet() {
        // 1. Update Balance
        balanceDisplay.textContent = `₹ ${currentBalance.toFixed(2)}`;
        userIdDisplay.textContent = userId;

        // 2. Render Transaction Lists
        renderTransactionList(latestTransactionList, transactions.slice(0, 5)); // Show top 5 on dashboard
        renderTransactionList(fullTransactionList, transactions); // Show all on history page
        
        document.getElementById('noHistoryMessage').classList.toggle('hidden', transactions.length > 0);
    }

    /** Helper function to format and render a list of transactions. */
    function renderTransactionList(ulElement, txArray) {
        ulElement.innerHTML = ''; // Clear previous list

        txArray.sort((a, b) => b.date - a.date); // Sort newest first

        txArray.forEach(tx => {
            const listItem = document.createElement('li');
            const sign = tx.type === 'credit' ? '+' : '-';
            const color = tx.type === 'credit' ? 'text-green-600' : 'text-red-600';
            const dateStr = tx.date.toLocaleDateString('en-IN', { month: 'short', day: 'numeric' });
            const timeStr = tx.date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

            listItem.className = 'transaction-list-item flex justify-between items-center py-3 px-4 rounded-lg bg-white shadow-sm';
            listItem.innerHTML = `
                <div>
                    <p class="font-medium text-gray-800">${tx.description}</p>
                    <p class="text-xs text-gray-500">${dateStr} at ${timeStr}</p>
                </div>
                <div class="font-bold ${color}">
                    ${sign} ₹ ${tx.amount.toFixed(2)}
                </div>
            `;
            ulElement.appendChild(listItem);
        });
    }

    /** Manages the view switching based on button clicks. */
    function changeView(viewId) {
        // Hide all views
        document.querySelectorAll('.view').forEach(view => {
            view.classList.add('hidden');
        });
        // Remove active class from all nav buttons
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('active');
            btn.classList.remove('bg-emerald-600');
            btn.classList.add('text-gray-700');
        });

        // Show the selected view
        document.getElementById(viewId).classList.remove('hidden');

        // Set active class on the corresponding nav button
        const activeBtn = document.getElementById('nav-' + viewId);
        if(activeBtn) {
            activeBtn.classList.add('active', 'bg-emerald-600');
            activeBtn.classList.remove('text-gray-700', 'hover:bg-emerald-50');
        }

        // Clear messages when switching views
        document.getElementById('payMessage').textContent = '';
        document.getElementById('addMessage').textContent = '';
    }

    // --- Transaction Handlers ---

    /** Simulates a wallet top-up. */
    function simulateDeposit() {
        const input = document.getElementById('addAmount');
        const amount = parseFloat(input.value);
        const method = document.getElementById('paymentMethod').value;
        const message = document.getElementById('addMessage');
        
        if (isNaN(amount) || amount <= 0) {
            message.textContent = 'Please enter a valid deposit amount.';
            message.classList.remove('text-emerald-600');
            message.classList.add('text-red-600');
            return;
        }
        
        currentBalance += amount;
        
        // Record the transaction
        transactions.push({
            id: crypto.randomUUID(),
            type: 'credit',
            description: `Wallet Top-Up via ${method}`,
            amount: amount,
            date: new Date()
        });
        
        // Update UI
        renderWallet();
        input.value = '';
        message.textContent = `✅ Successfully added ₹ ${amount.toFixed(2)} to your wallet!`;
        message.classList.add('text-emerald-600');
        message.classList.remove('text-red-600');
        
        // Switch back to dashboard after a delay
        setTimeout(() => changeView('dashboard'), 2000);
    }

    /** Simulates a campus payment. */
    function simulatePayment() {
        const merchant = document.getElementById('merchant').value;
        const input = document.getElementById('payAmount');
        const amount = parseFloat(input.value);
        const message = document.getElementById('payMessage');

        if (isNaN(amount) || amount <= 0) {
            message.textContent = 'Please enter a valid payment amount.';
            message.classList.remove('text-emerald-600');
            message.classList.add('text-red-600');
            return;
        }

        if (currentBalance < amount) {
            message.textContent = `❌ Insufficient funds. Your balance is only ₹ ${currentBalance.toFixed(2)}.`;
            message.classList.remove('text-emerald-600');
            message.classList.add('text-red-600');
            return;
        }

        // Process payment
        currentBalance -= amount;

        // Record the transaction
        transactions.push({
            id: crypto.randomUUID(),
            type: 'debit',
            description: merchant + ' Purchase',
            amount: amount,
            date: new Date()
        });

        // Update UI
        renderWallet();
        input.value = '';
        message.textContent = `✅ Payment of ₹ ${amount.toFixed(2)} to ${merchant} successful!`;
        message.classList.add('text-emerald-600');
        message.classList.remove('text-red-600');

        // Switch back to dashboard after a delay
        setTimeout(() => changeView('dashboard'), 2000);
    }

    // --- Initialization ---
    
    // Initial load when the page is ready
    window.onload = function() {
        renderWallet();
        changeView('dashboard'); // Start on the dashboard
    };

</script>

</body>
</html>
