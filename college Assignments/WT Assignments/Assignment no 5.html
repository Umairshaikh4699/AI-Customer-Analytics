<!DOCTYPE html>
<html>
<head>
    <title>Mouse Button Tracker</title>
</head>
<body>
    <h2>Click anywhere to test mouse buttons</h2>
    <p>Open your browser console (right-click > Inspect > Console) to see the output.</p>

    <script>
        // Input object to store mouse button states
        const Input = {
            mouse: {
                left: false,
                middle: false,
                right: false
            }
        };

        // Detect mouse button press
        document.addEventListener("mousedown", function(event) {
            if (event.button === 0) {
                Input.mouse.left = true;
            }
            if (event.button === 1) {
                Input.mouse.middle = true;
            }
            if (event.button === 2) {
                Input.mouse.right = true;
            }

            console.log("Mouse Down:", Input.mouse);
        });

        // Detect mouse button release
        document.addEventListener("mouseup", function(event) {
            if (event.button === 0) {
                Input.mouse.left = false;
            }
            if (event.button === 1) {
                Input.mouse.middle = false;
            }
            if (event.button === 2) {
                Input.mouse.right = false;
            }

            console.log("Mouse Up:", Input.mouse);
        });

        // Prevent default context menu on right-click to see the result
        document.addEventListener("contextmenu", function(event) {
            event.preventDefault();
        });
    </script>
</body>
</html>
